<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="580" rx="12" fill="url(#bgGrad)"/>
  <!-- Spine Shadow -->
  <rect x="0" y="0" width="28" height="580" fill="#000" opacity="0.3"/>
  <line x1="28" y1="0" x2="28" y2="580" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <!-- Geometric Web Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <circle cx="280" cy="180" r="120"/>
    <circle cx="280" cy="180" r="70"/>
    <circle cx="280" cy="180" r="30"/>
    <line x1="80" y1="180" x2="380" y2="180"/>
    <line x1="280" y1="40" x2="280" y2="320"/>
    <polygon points="280,110 340,215 220,215"/>
  </g>
  <!-- Category Tag -->
  <rect x="54" y="55" width="130" height="24" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
  <text x="64" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">WEB DEVELOPMENT</text>
  <!-- Book Title -->
  <text x="54" y="130" font-family="'Georgia', serif" font-size="30" font-weight="bold" fill="#ffffff" width="300">
    <tspan x="54" dy="0">Mastering Modern</tspan>
    <tspan x="54" dy="36" fill="url(#cyanGrad)">Web Architecture</tspan>
  </text>
  <!-- Subtitle -->
  <text x="54" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1" font-weight="400">
    <tspan x="54" dy="0">Microservices, Distributed Systems</tspan>
    <tspan x="54" dy="18">&amp; Resilient Frontend Foundations</tspan>
  </text>
  <!-- Decorative Code Icon -->
  <g transform="translate(54, 380)" stroke="#818cf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 15 L10 30 L25 45"/>
    <path d="M45 15 L60 30 L45 45"/>
    <path d="M38 12 L32 48"/>
  </g>
  <!-- Author and Badge -->
  <line x1="54" y1="480" x2="350" y2="480" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="54" y="515" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Dr. Aris Thorne</text>
  <text x="54" y="535" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Enterprise Architect • WebPress</text>
  <!-- Rating Stamp -->
  <rect x="300" y="500" width="55" height="30" rx="6" fill="#fbbf24" fill-opacity="0.2"/>
  <text x="327" y="520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">★ 4.9</text>
</svg>

